---
- name : Run svtrace
  shell: |
    rm -f /tmp/svtrace.pid /tmp/results
    . {{ svtrace_venv_path }}/bin/activate
    taskset -c {{ svtrace_core }} {{ svtrace_venv_path }}/bin/python3 -c '
    import asyncio
    import runpy

    class CompatChildWatcher:
        def attach_loop(self, loop):
            pass

    watcher = CompatChildWatcher()
    asyncio.SafeChildWatcher = CompatChildWatcher
    asyncio.set_child_watcher = lambda child_watcher: None
    asyncio.get_child_watcher = lambda: watcher
    asyncio.set_event_loop(asyncio.new_event_loop())
    runpy.run_path("{{ svtrace_venv_path }}/bin/svtrace.py", run_name="__main__")
    ' --record --conf /etc/svtrace.cfg --machine {{ "hypervisor" if "hypervisors" in group_names else "VM" }} --out /tmp/ &
    svtrace_pid=$!
    printf '%s\n' "$svtrace_pid" > /tmp/svtrace.pid
    wait "$svtrace_pid"
  async: 9999999
  poll: 0
  register: svtrace_status
- name: Make sure svtrace has time to start
  wait_for:
    timeout: 5
- name: Register svtrace status
  set_fact:
    active_svtrace: >-
      {{
        active_svtrace +
        [
          {
            'machine': group_names[0],
            'status': svtrace_status
          }
        ]
      }}
