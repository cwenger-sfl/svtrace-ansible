---
- name: set platform
  set_fact:
    target_architecture: "{{ hostvars[inventory_hostname]['target_platform'] | default(target_platform) }}"
- name: Stop sv_timestamp_logger container
  become: true
  ansible.builtin.command:
    cmd: docker rm --force sv_timestamp_logger_{{ target_architecture }}
  register: stop_sv_timestamp_logger
  changed_when: stop_sv_timestamp_logger.rc == 0
  failed_when: >-
    stop_sv_timestamp_logger.rc != 0 and
    'No such container' not in
    (stop_sv_timestamp_logger.stdout ~ stop_sv_timestamp_logger.stderr)

- name: Run SV timestamp logger container
  become: true
  ansible.builtin.command:
    cmd: >-
      docker run --detach
      --name sv_timestamp_logger_{{ target_architecture }}
      --privileged
      {% if sv_ts_core is defined and not sv_ts_core is none %}
      --cpuset-cpus {{ sv_ts_core }}
      {% endif %}
      --volume {{ ansible_user_dir }}/latency_tests:/tmp/latency_tests
      {% if clock_device is defined and clock_device | length > 0 %}
      --device {{ clock_device }}:{{ clock_device }}
      {% endif %}
      --network host
      --cap-add NET_ADMIN
      --cap-add SYS_NICE
      localhost/sv_timestamp_logger_{{ target_architecture }}
      -d {{ sv_interface }}
      -f /tmp/latency_tests/ts_{{ inventory_hostname }}.txt
      -s {{ stream_to_log }}
      {% if 'publisher' in group_names %}
      -t
      {% endif %}
      {% if clock_device is defined and clock_device | length > 0 %}
      --clock_device {{ clock_device }}
      {% endif %}
  when: enable_sv_ts is defined and enable_sv_ts|bool == true
