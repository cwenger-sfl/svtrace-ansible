---
all:
  vars:
    ansible_python_interpreter: /usr/bin/python3
    ansible_ssh_private_key_file: ~/.ssh/seapath-sfl
    ansible_ssh_common_args: "-o StrictHostKeyChecking=no -o IdentitiesOnly=yes"
    ansible_remote_tmp: /tmp/.ansible/tmp
    first_SV: 0
    stream_to_log: "0000"
    svtrace_venv_path: /tmp/svtrace_venv/
    test_duration: 10

  children:
    standalone_machine:
      children:
        publisher:
          hosts:
            publisher_host:
              ansible_host: 10.201.201.11
              ansible_user: admin
              ansible_connection: ssh
              ansible_ssh_private_key_file: ~/.ssh/seapath-sfl
              ansible_ssh_common_args: "-o StrictHostKeyChecking=no -o IdentitiesOnly=yes"
              ansible_ssh_transfer_method: piped
              target_platform: amd64

              sv_interface: enp0s31f6
              pcap_file: /home/admin/git/svtrace-ansible/test.pcap
              pcap_cycles: 10
              bittwist_core: 2
              enable_sv_ts: true
              sv_ts_core: 3
              clock_device: /dev/ptp0

        subscriber:
          hosts:
            subscriber_host:
              ansible_host: 192.168.200.161
              ansible_user: root
              ansible_ssh_private_key_file: ~/.ssh/id_rsa
              ansible_ssh_common_args: "-o StrictHostKeyChecking=no -o IdentitiesOnly=yes"
              target_platform: arm64

              sv_interface: enP1p5s0
              enable_svtrace: false
              svtrace_core: 4
              enable_sv_ts: true
              sv_ts_core: 5
              clock_device: /dev/ptp1
              docker_disable_bridge: true
