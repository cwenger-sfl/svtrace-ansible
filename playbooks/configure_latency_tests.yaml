---
- name: Prepare localhost
  hosts:
    - localhost
  tasks:
    - name: Build_sv_timestamp_analysis
      include_role:
        name: "build_sv_timestamp_analysis"
    - name: Build sv_timestamp_logger for each target architecture
      include_role:
        name: "build_sv_timestamp_logger"
      with_items: "{{ (groups['publisher'] | default([])) + (groups['subscriber'] | default([])) }}"
      loop_control:
        loop_var: subscriber_name

- name: Prepare SEAPATH target
  hosts:
    - publisher
    - subscriber
    - reference_logger
  tasks:
    - name: Configure Docker without bridge networking
      become: true
      ansible.builtin.copy:
        content: |
          {"iptables": false, "ip6tables": false, "bridge": "none"}
        dest: /etc/docker/daemon.json
        owner: root
        group: root
        mode: "0644"
      when: docker_disable_bridge | default(false) | bool
      register: docker_configuration

    - name: Start Docker daemon
      become: true
      ansible.builtin.systemd_service:
        name: docker
        enabled: true
        state: "{{ 'restarted' if docker_configuration.changed else 'started' }}"
      when: docker_disable_bridge | default(false) | bool

    - name: Deploy sv_timestamp_logger
      include_role:
        name: "deploy_sv_timestamp_logger"

- name: Prepare publisher and hypervisor
  become: true
  hosts:
    - publisher
    - hypervisors
  tasks:
      - name: Disable kernel adresses exposition restriction
        shell:
          cmd: >-
            echo 0 > /proc/sys/kernel/kptr_restrict
        when: enable_svtrace is defined and enable_svtrace|bool == true
- name: Configure svtrace
  become: true
  hosts:
    - subscriber
    - hypervisors
  tasks:
    - name: Configure svtrace
      include_role:
        name: "build_svtrace"

- name: Prepare vms
  become: true
  hosts:
    - subscriber
  tasks:
      - name: Disable kernel adresses exposition restriction
        shell:
          cmd: >-
            echo 0 > /proc/sys/kernel/kptr_restrict
        when: enable_svtrace is defined and enable_svtrace|bool == true
